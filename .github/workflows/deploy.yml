# Publica el sitio en GitHub Pages.
#
# GitHub Pages no sabe compilar un proyecto de Vite: si se le apunta a la rama
# tal cual, sirve el index.html del codigo fuente (el que carga /src/main.tsx)
# y el navegador se queda en blanco. Por eso aqui se compila primero y se
# publica unicamente la carpeta dist/.
#
# Requisito en el repositorio:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue a mano desde la pestana Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan varios commits seguidos, termina el ultimo despliegue y
# cancela los intermedios
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Incluye el chequeo de tipos: un error de TS detiene el despliegue
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
